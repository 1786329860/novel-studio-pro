# ============================================================
# Novel Studio Pro - OpenResty/Nginx 反向代理配置
# 适用于: 1Panel + OpenResty 环境
# ============================================================
#
# 使用方法:
# 1. 在 1Panel 面板中创建网站
# 2. 将此配置内容粘贴到网站的 Nginx 配置中
# 3. 或保存为 /etc/openresty/conf.d/novel-studio.conf
# ============================================================

# 如果有域名，替换为实际域名
# server_name your-domain.com;

# 如果没有域名，使用 _ 或服务器 IP
server_name _;

# ----- 安全头 -----
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# ----- CSP (按需启用) -----
# add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; img-src 'self' data:;" always;

# ----- Gzip 压缩 -----
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
gzip_min_length 256;

# ----- 请求体大小限制 (小说内容可能较长) -----
client_max_body_size 50m;

# ----- API 反向代理 -----
location /api/ {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 生成任务可能需要较长时间
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # 支持 SSE (Server-Sent Events，预留)
    proxy_buffering off;
    proxy_cache off;
}

# ----- API 文档 -----
location /docs {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /openapi.json {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
}

# ----- 健康检查 -----
location /api/health {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    access_log off;
}

# ----- 静态文件 (前端) -----
# 如果后端已托管静态文件，则不需要此段
# 如果使用 OpenResty 直接服务前端文件，取消注释并修改路径:
#
# location / {
#     root /opt/novel-studio/novel-studio-pro-frontend-v3;
#     index index.html;
#     try_files $uri $uri/ /index.html;
#
#     # 静态资源缓存
#     location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
#         expires 30d;
#         add_header Cache-Control "public, immutable";
#     }
# }

# ----- 如果后端托管了静态文件，直接代理到后端 -----
location / {
    proxy_pass http://127.0.0.1:8765;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
